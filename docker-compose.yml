services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hackteen
      POSTGRES_USER: hackteen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackteen-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackteen -d hackteen"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hackteen:${POSTGRES_PASSWORD:-hackteen-local}@db:5432/hackteen?schema=public
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  parser:
    profiles: ["local-parser"]
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hackteen:${POSTGRES_PASSWORD:-hackteen-local}@db:5432/hackteen?schema=public
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    command: ["npm", "run", "parser:schedule"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
